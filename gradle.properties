###############################
###### GRADLE PROPERTIES ######
###############################
org.gradle.jvmargs=-Xmx4G
org.gradle.workers.max=2
# Offline must be false for NeoForge dependency resolution on a fresh port.
org.gradle.offline=false
org.gradle.parallel=true
org.gradle.caching=true
##########################
###### ENVIRONMENT #######
##########################
# Target: Minecraft 26.2 / NeoForge 26.2 (moddev 2.0.144, Java 25, Gradle 9.2.1)
minecraft_version=26.2
minecraft_version_range=[26.2]
neo_version=26.2.0.59
# The declared requirement (what neoforge.mods.toml enforces at load) is deliberately looser than
# the version we build against: pinning it to the build version locked players out of every
# NeoForge release below it for no reason. 26.2.0.59 is the floor we support.
neo_version_range=[26.2.0.59,)
loader_version_range=[4,)
# 26.x: official MDK has no Parchment block (unobfuscated Minecraft since 26.1).
# Mandatory deps — versions verified on their official Maven repos / Modrinth (2026-11).
geckolib_version=5.5.6
geckolib_version_range=[5.5.6,)
terrablender_version=26.2-26.2.0.0.2
terrablender_version_range=[26.2-26.2.0.0.2,)
curios_version=16.0.0+26.2
curios_version_range=[16.0.0+26.2,)
# Optional compile-time only (JEI API verified on maven.blamejared.com)
jei_version=30.48.0.244
#############################
###### MOD INFORMATION ######
#############################
mod_id=dragonminez
mod_name=DragonMineZ
mod_license=GNU General Public License v3.0
#########################
### mod_version follows the format: version.major.minor[.patch]-[tags]
### - Normally the version prefix '-beta' or '-alpha' is used for pre-release versions.
mod_version=3.0.0
#########################
mod_group_id=com.dragonminez.mod
mod_authors=Yuseix300 & ezShokkoh
mod_credits=A special thanks to Bruno, Kyo, UB, YaibaToKen, Ben, Antro, and everyone else who supported the mod in some way.
mod_description=The DragonMine Z Mod is a Minecraft NeoForge Mod based on the Dragon Ball Series made by Akira Toriyama.\n\
  \ This mod adds NPCs, Transformations, Stats System, Dimensions and more!
